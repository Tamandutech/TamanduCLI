[project]
name = "tamanducli"
version = "0.1.0"
description = "CLI and helpers for developing, testing, and debugging robots over Bluetooth LE (Nordic UART Service)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncio>=3.4.3",
    "bleak>=0.22.3",
    "ipykernel>=6.29.5",
    "matplotlib>=3.9.2",
    "networkx>=3.4.2",
    "ruff>=0.7.0",
]
